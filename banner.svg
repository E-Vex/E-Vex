<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" width="900" height="346" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">E-Vex</title>
<desc id="d">A terminal showing hexdump -C about.txt. The ASCII column reads: Eliea Azzam, aka E-Vex, systems in C, Linux, networking, security.</desc>
<style>
    .bg{fill:#0a1310}
    .bd{fill:none;stroke:#1a2e25;stroke-width:1}
    text{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:16px;white-space:pre}
    .off{fill:#35564a}
    .hx{fill:#5f8574}
    .as{fill:#e3f4ea}
    .ps{fill:#6ee7a6}
    .cm{fill:#a9c7b8}
    .cur{fill:#6ee7a6}

    .a{opacity:0;animation:on .01s linear forwards}
    @keyframes on{to{opacity:1}}
    .cur{animation:blink 1.1s steps(1) infinite;animation-delay:3.4s}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .a{animation:none;opacity:1}
      .cur{animation:none;opacity:1}
    }
</style>
<rect class="bg" width="900" height="346" rx="10"/>
<rect class="bd" x="0.5" y="0.5" width="899" height="345" rx="10"/>
<text x="48" y="58" class="a" style="animation-delay:0.30s" xml:space="preserve"><tspan class="ps">evex:~$</tspan><tspan class="cm"> hexdump -C about.txt</tspan></text>
