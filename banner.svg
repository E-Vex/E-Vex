<text x="48" y="162" class="a" style="animation-delay:1.90s" xml:space="preserve"><tspan class="off">00000020</tspan><tspan class="hx">  73 79 73 74 65 6d 73 20  69 6e 20 43 20 20 20 0a  </tspan><tspan class="off">|</tspan><tspan class="as">systems in C   </tspan><tspan class="off">.</tspan><tspan class="off">|</tspan></text>
